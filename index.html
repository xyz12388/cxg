.dots i.ok{background:var(--pink);box-shadow:0 0 10px #ff8fd8aa;border-color:transparent}

#start::after,#submit::after{content:" ♡"}

 let total=CATS.reduce((a,c)=>a+scores[c],0)*1.25;
 // 長文密度修正：超過 60 字但明確語氣線索太稀疏時，輕微降分（最多 -30%）
 if(length>60){
   const density=strongTotal/(length/30);
   if(density<1)total=Math.round(total*(0.7+0.3*density));
 }
 const raw=total;let sc=100*(1-Math.exp(-raw/31));
 if(raw>=55){const base=100*(1-Math.exp(-55/31));
  if(raw<62)sc=base+(90-base)*(raw-55)/7;
  else sc=90+10*Math.min(1,(raw-62)/38);}
 total=Math.max(0,Math.min(100,Math.round(sc)));
 // 扣題檢查（輕量）：回答與題目沒有任何共通的有意義字 → 小扣分
 let offtopic=false;
 if(current&&total>0&&answer.length>=4){
  const stop=new Set("你我他她它的了是在有人說會怎麼樣回應嗎呢吧啊呀喔哦嘛啦這那個什麼為何如果要想可以不都就也很還和跟對把被讓給來去時候一二三四五六七八九十，。？！、：；「」『』（）～♡♥ ,.?!:;\"'()~".split(""));
  const qs=[...new Set([...current].filter(c=>!stop.has(c)))];
  let hit=qs.some(c=>answer.includes(c));
  if(!hit){hit=SYN.some(g=>g.some(w=>current.includes(w))&&g.some(w=>answer.includes(w)));}
  if(qs.length>=2&&!hit){offtopic=true;total=Math.round(total*0.88);}
 }
 return {total,scores,raw,offtopic};
}
